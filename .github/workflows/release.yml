name: Publish Package

# 发布 GitHub Packages：
#   - 用 GITHUB_TOKEN 发布 @<owner>/dsh-codearts-connect（打 tag 发布 Release 时触发）
#   - 本项目不发布到 npmjs；npm 发布任务已移除，无需 npm 账号或 Trusted Publisher。
# 触发：GitHub Release 发布（打 tag 发布 release 即触发）或手动 workflow_dispatch。
#
# 前置（一次性）：
#   无需额外配置；GitHub Packages 使用仓库内置的 GITHUB_TOKEN。
#   （GitHub Packages 不接受无 scope 包名，所以上传时会临时改名成
#    @2239058652/dsh-codearts-connect，仓库源码里的包名保持不变。）
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # 必须与 GitHub 用户名一致；仅用于 GitHub Packages 那一路上传时的临时改名。
  NPM_SCOPE: '@2239058652'

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: ${{ env.NPM_SCOPE }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Retag as scoped package for GitHub Packages
        # 只在 CI 里临时把包名改成 @<owner>/dsh-codearts-connect，
        # 不动仓库源码里的无 scope 包名 dsh-codearts-connect
        run: npm pkg set name="$NPM_SCOPE/dsh-codearts-connect"
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
